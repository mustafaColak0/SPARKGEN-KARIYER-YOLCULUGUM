<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masqot CMS - Fullstack Blog</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class ="container">
            <h1> Mini Blog İçerik Yönetim Sistemi (CMS)</h1>

            <!-- Yazı Ekleme Formu -->
        <div class ="card">
            <h2>Yeni İçerik Ekle</h2>
            <form id="postForm">
                <div class="form-group">
                    <label for="title">Yazı Başlığı</label>
                    <input typ="text" id="title" placeholder="Harika bir başlık yaz..." required>
                    </div>
                    <div class="form-group">
                        <label for="content">İçerik</label>
                        <textarea id="content" rows="5" placeholder="Blog içeriğini buraya dök..." required></textarea>
                        </div>
                        <button type="submit" id="submitBtn">Yazıyı Yayınla ⚡</button>
                        </form>
                        </div>
        <!-- Yazı Listeleme Alanı -->
<div class="card">
<h2>Yayınlanan Yazılar</h2>
<div id="postsList">
    <p class="loading">Yazılar yükleniyor veya henüz hiç yazı eklenmedi...</p> </p>
</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
